server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en otro contenedor. El front llama a /api/... y aqui se
    # elimina el prefijo /api antes de reenviar (proxy_pass con / final).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estaticos con cache larga
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Aplicacion SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
