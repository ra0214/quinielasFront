<app-encabezado-pagina
  titulo="CONCURSO"
  descripcion="Registro y consulta de concursos de quinielas">
  <button class="btn btn-secundario" (click)="abrirConsulta()">CONSULTA INFO. MEDIA SEMANA/FIN DE SEMANA</button>
  <button class="btn btn-primario" (click)="nuevo()">+ NUEVO CONCURSO</button>
</app-encabezado-pagina>

<div class="resumen">
  <app-tarjeta-resumen etiqueta="Total ediciones" [valor]="totalEdiciones" tono="azul" />
  <app-tarjeta-resumen etiqueta="Media semana" [valor]="contar('MEDIA_SEMANA')" />
  <app-tarjeta-resumen etiqueta="Fin de semana" [valor]="contar('FIN_DE_SEMANA')" />
</div>

<div class="toolbar">
  <button class="btn btn-secundario" (click)="cargar()"><app-icono nombre="recargar" /> Recargar</button>
</div>

@if (errorApi) {
  <div class="aviso aviso-error">{{ errorApi }}</div>
}

<app-tabla
  [columnas]="columnas"
  [filas]="ediciones()"
  [cargando]="cargando"
  columnaOrden="id_edicion"
  trackClave="id_edicion"
  iconoVacio="calendario"
  mensajeVacio="Aún no hay ediciones registradas">
  <ng-template celda="id_edicion" let-fila>
    <strong>#{{ fila.id_edicion }}</strong>
  </ng-template>
  <ng-template celda="tipo_edicion" let-fila>
    {{ etiquetaTipo(fila.tipo_edicion) }}
  </ng-template>
  <ng-template celda="nombre_edicion" let-fila>
    <strong>{{ fila.nombre_edicion }}</strong>
  </ng-template>
  <ng-template celda="acciones" let-fila>
    <button class="btn btn-mini btn-ghost" (click)="editar(fila)">
      <app-icono nombre="editar" /> Editar
    </button>
    <button
      class="btn btn-mini btn-peligro"
      (click)="eliminar(fila)"
      title="Eliminar edición"
      aria-label="Eliminar edición">
      <app-icono nombre="eliminar" />
    </button>
  </ng-template>
</app-tabla>

<app-modal
  [visible]="modalVisible"
  [titulo]="editandoId === null ? 'NUEVO CONCURSO' : 'Editar concurso'"
  (cerrar)="cerrarModal()">
  @if (errorFormulario) {
    <div class="aviso aviso-error">{{ errorFormulario }}</div>
  }
  <div class="formulario-grid">
    <div class="campo">
      <label>Tipo de concurso <span class="req">*</span></label>
      <select [(ngModel)]="formulario.tipo_edicion">
        <option value="FIN_DE_SEMANA">Fin de semana</option>
        <option value="MEDIA_SEMANA">Media semana</option>
      </select>
    </div>
    <div class="campo">
      <label>Número de concurso <span class="req">*</span></label>
      <input
        type="text"
        [(ngModel)]="formulario.nombre_edicion"
        placeholder="Ej. 2353" />
    </div>
    @if (editandoId !== null) {
      <div class="campo">
        <label>Fecha de inicio</label>
        <input type="text" [value]="fechaInicioEditando ? fecha(fechaInicioEditando) : ''" disabled />
        <div class="ayuda">La fecha de inicio la asigna el sistema.</div>
      </div>
    }
  </div>

  <div pie>
    <button class="btn btn-ghost" (click)="cerrarModal()">CANCELAR</button>
    <button class="btn btn-primario" [disabled]="guardando" (click)="guardar()">
      {{ guardando ? 'Guardando…' : 'CREAR' }}
    </button>
  </div>
</app-modal>

<!-- Modal consulta info -->
<app-modal [visible]="consultaVisible" titulo="¿Qué quiniela deseas obtener info.?" (cerrar)="cerrarConsulta()">
  <div style="display:flex; flex-direction:column; gap:12px; margin-top:8px">
    <button class="btn btn-secundario" (click)="abrirMediaSemana()">MEDIA SEMANA</button>
    <button class="btn btn-secundario" (click)="abrirFinSemana()">FIN DE SEMANA</button>
  </div>
  <div pie>
    <button class="btn btn-ghost" (click)="cerrarConsulta()">Cancelar</button>
  </div>
</app-modal>

<app-confirm-dialog
  [visible]="!!pendiente"
  titulo="Eliminar edición"
  [mensaje]="'¿Seguro que deseas eliminar la edición ' + (pendiente?.nombre_edicion ?? '') + '? Esta acción no se puede deshacer.'"
  textoConfirmar="Eliminar"
  (confirmar)="confirmarEliminacion()"
  (cancelar)="pendiente = null">
</app-confirm-dialog>
